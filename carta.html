<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --cream:#EEE2CB; --beige:#E4D5B6; --sand:#E2D4B5; --brown-soft:#3E6150; --brown:#1B4532; --espresso:#12301F; --leaf:#1B4532; --leaf-deep:#1B4532; --roast:#0E281B;
    --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); color:var(--espresso); font-family:var(--sans); font-weight:300; line-height:1.6; padding-bottom:6.5rem; }
  header { background:var(--leaf-deep); color:var(--cream); padding:2.4rem 1.4rem 2rem; text-align:center; }
  header small { display:block; letter-spacing:.3em; font-size:.7rem; color:#EEE2CB; text-transform:uppercase; margin-bottom:.6rem; }
  header h1 { font-family:var(--serif); font-weight:400; font-size:2.3rem; line-height:1.1; }
  #table[hidden] { display:none; }
  #table { display:inline-block; margin-top:.9rem; padding:.25rem .9rem; border:1px solid #EEE2CB; color:#EEE2CB; letter-spacing:.14em; text-transform:uppercase; font-size:.75rem; opacity:1; }
  header p { margin-top:.6rem; font-size:.9rem; opacity:.8; }
  main { max-width:640px; margin:0 auto; padding:1.2rem 1.2rem 0; }
  .dish { display:flex; gap:1rem; align-items:flex-start; padding:1.1rem 0; border-bottom:1px solid var(--sand); }
  .dish img { width:88px; height:88px; object-fit:cover; border-radius:4px; flex:none; background:var(--beige); }
  .dish .body { flex:1; min-width:0; }
  .dish h2 { font-family:var(--serif); font-weight:500; font-size:1.35rem; line-height:1.2; }
  .dish p { font-size:.88rem; color:var(--brown); margin-top:.15rem; }
  .dish .tag { display:inline-block; margin-top:.35rem; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--leaf); }
  .dish .price { font-weight:500; color:var(--leaf); white-space:nowrap; padding-left:.5rem; }
  .status { text-align:center; padding:2.5rem 0; color:var(--brown-soft); }
  .info { max-width:640px; margin:1.6rem auto 0; padding:0 1.2rem; font-size:.85rem; color:var(--brown-soft); }
  .info p { margin-top:.2rem; }
  .bar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:.7rem; padding:.8rem 1rem max(.8rem, env(safe-area-inset-bottom, 0px)); background:rgba(247,241,230,.96); border-top:1px solid var(--sand); backdrop-filter:blur(8px); }
  .bar a { flex:1; text-align:center; padding:.95rem .5rem; text-decoration:none; font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; border:1px solid var(--leaf-deep); color:var(--leaf-deep); }
  .bar a.primary { background:var(--leaf-deep); color:var(--cream); }
  .bar a[hidden] { display:none; }
</style>
</head>
<body>
<header>
  <small>Carta</small>
  <h1 id="name">Nuestra carta</h1>
  <p>Lo que hay disponible hoy</p>
  <p id="table" hidden></p>
</header>
<main>
  <div id="list" aria-live="polite"><p class="status">Cargando…</p></div>
</main>
<div class="info">
  <p data-info="hours"></p>
  <p data-info="address"></p>
</div>
<nav class="bar" aria-label="Acciones">
  <a class="primary" href="index.html#reservas">Reservar mesa</a>
  <a id="wa" href="#" target="_blank" rel="noopener" hidden>WhatsApp</a>
</nav>
<script src="demo-api.js"></script>
<script src="carta.js" defer></script>
</body>
</html>
